name: CI

# Déclenchement : push et Pull Request sur main et develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── ESLint ────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Génération du client Prisma
        run: npx prisma generate

      - name: Analyse ESLint
        run: npm run lint

  # ── compilation + tests ──────────────────────────────
  test:
    name: Tests et compilation
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/cesizen?schema=public"
      JWT_SECRET: "ci-test-secret"
      JWT_EXPIRES_IN: "1h"

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Génération du client Prisma
        run: npx prisma generate

      - name: Compilation TypeScript
        run: npm run build

      - name: Exécution des tests
        run: npm test

  # ── audit de sécurité des dépendances ────────────────
  audit:
    name: Audit de sécurité des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Audit npm (niveau high)
        run: npm audit --audit-level=high
