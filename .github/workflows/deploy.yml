name: Deploy API

# Déclenchement : à la publication d'un tag de version (ex. v1.0.0, v1.2.3)
# La mise en production est donc un acte volontaire et versionné.
on:
  push:
    tags:
      - "v*"

jobs:
  # ── 1. Tests (on ne déploie jamais une version non testée) ───
  test:
    name: Tests et compilation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/cesizen?schema=public"
      JWT_SECRET: "ci-test-secret"
      JWT_EXPIRES_IN: "1h"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  # ── 2. Construction et publication de l'image (taguée) ───────
  build-and-push:
    name: Build et push de l'image Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génère automatiquement les tags d'image à partir du tag Git :
      # v1.2.3 → image:1.2.3, image:1.2, image:latest
      - name: Préparation des tags d'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/amaurycesizen/cesizen-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 3. Déploiement sur la VM via SSH ─────────────────────────
  deploy:
    name: Déploiement sur la VM (production)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configuration de la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Déploiement
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen
            docker compose -f compose.prod.yml pull api
            docker compose -f compose.prod.yml up -d
            docker image prune -f
          EOF
